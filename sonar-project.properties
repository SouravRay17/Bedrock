# =====================================================================
# SonarQube & SonarCloud Configuration - Amazon BedRock AgentOS Studio
# =====================================================================

# Project Identification
sonar.projectKey=amazon-bedrock-agentos
sonar.projectName=Amazon BedRock AgentOS Studio
sonar.projectVersion=1.0.0

# Source & Test File Paths
sonar.sources=services,packages,apps/api,apps/web/src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.ruff_cache/**,\
  data/**,\
  .agents/**,\
  graphify-out/**,\
  **/*.min.js,\
  **/*.bundle.js

sonar.test.inclusions=\
  tests/**/test_*.py,\
  tests/**/*_test.py

# Python Analysis Settings
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-reports/pytest-report.xml

# JavaScript / React Frontend Settings
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Security & Vulnerability Auditing
# Prevents false-positives while strictly catching OWASP Top 10, CWE, SSRF, Hardcoded Secrets
sonar.security.hotspots.review=true
sonar.cwe.coverage=true
sonar.owaspTop10.coverage=true

# Code Smells & Duplications Tuning
sonar.cpd.exclusions=\
  packages/agent_spec/models.py,\
  tests/**
