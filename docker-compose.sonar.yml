version: "3.8"

services:
  sonarqube:
    image: sonarqube:community
    container_name: agentos-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_secret_password
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - sonarnet

  db:
    image: postgres:15-alpine
    container_name: agentos-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_secret_password
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sonarnet

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: agentos-sonar-scanner
    profiles:
      - scan
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: "http://sonarqube:9000"
    volumes:
      - .:/usr/src
    working_dir: /usr/src
    entrypoint: ["sonar-scanner"]
    networks:
      - sonarnet

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:

networks:
  sonarnet:
    driver: bridge
