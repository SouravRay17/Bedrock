name: SonarQube Quality Gate & Security Analysis

on:
  push:
    branches: [ "main", "develop", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube Quality Gate & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for accurate SonarQube analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pylint

      - name: Run Ruff Linting & Formatting Check
        run: |
          ruff check .

      - name: Run PyLint (Errors Only Quality Gate)
        run: |
          python -m pylint services packages apps/api --errors-only

      - name: Run Tests & Generate XML Coverage
        run: |
          pytest --cov=services --cov=packages --cov=apps/api --cov-report=xml:coverage.xml

      - name: Set up Node.js for Frontend Checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package.json"

      - name: Lint Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run lint

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        if: ${{ env.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
