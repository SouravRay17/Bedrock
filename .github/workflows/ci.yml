name: Continuous Integration & Security Pipeline

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main", "feature/**", "fix/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. SECURITY & VULNERABILITY AUDIT (BANDIT SAST & DEPENDENCY AUDIT)
  # =========================================================================
  security-sast-audit:
    name: "🛡️ Security & Vulnerability SAST (Bandit & Dependency Audit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST Security Vulnerability Scan
        run: |
          echo "Scanning Python codebase for security vulnerabilities..."
          bandit -r services packages apps/api infra -ll --exclude .venv,tests,scratch

      - name: Run Dependency Vulnerability Audit
        run: |
          echo "Auditing dependencies for known CVEs..."
          pip install -r requirements.txt
          pip-audit --desc on || echo "Dependency audit finished with advisory notices."

  # =========================================================================
  # 2. CODE QUALITY & LINTING (PYRUFF & PYLINT)
  # =========================================================================
  code-quality-lint:
    name: "🧹 Code Quality & Linting (PyRuff & PyLint)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pylint

      - name: Run PyRuff Linter & Formatter Check
        run: |
          echo "Checking code style and formatting with Ruff..."
          ruff check .

      - name: Run PyLint Quality Gate
        run: |
          echo "Running PyLint strict error check..."
          python -m pylint services packages apps/api infra --errors-only

  # =========================================================================
  # 3. FRONTEND QUALITY (REACT WEB ESLINT)
  # =========================================================================
  frontend-quality:
    name: "⚛️ Frontend Quality Gate (ESLint React)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package.json"

      - name: Lint Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run lint

  # =========================================================================
  # 4. COMPREHENSIVE AUTOMATED TEST SUITE & COVERAGE
  # =========================================================================
  unit-tests-coverage:
    name: "🧪 Comprehensive Test Suite (36 PyTest Cases & Coverage)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov anyio

      - name: Execute Full Test Suite
        run: |
          echo "Executing all unit, security, guardrail, and CDK tests..."
          pytest tests/ -v --cov=services --cov=packages --cov=apps/api --cov=infra --cov-report=xml:coverage.xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  # =========================================================================
  # 5. AWS CDK EPHEMERAL ENVIRONMENT SYNTH & PREVIEW
  # =========================================================================
  cdk-ephemeral-synth:
    name: "☁️ Ephemeral Environment Synth & Preview (AWS CDK)"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js for CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python CDK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synthesize CloudFormation Ephemeral Stack (cdk synth)
        run: |
          echo "Synthesizing AWS CDK Ephemeral Environment Template for Bedrock AgentOS Studio..."
          npx --yes aws-cdk@latest synth

      - name: Preview Deployment Plan (cdk diff)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          echo "Previewing ephemeral infrastructure diff against AWS..."
          npx --yes aws-cdk@latest diff || true

  # =========================================================================
  # 6. SONARQUBE / SONARCLOUD QUALITY GATE
  # =========================================================================
  sonarqube-gate:
    name: "📊 SonarQube Security Quality Gate"
    runs-on: ubuntu-latest
    needs: [unit-tests-coverage]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: code-coverage-report
        continue-on-error: true

      - name: Run SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Enforce SonarQube Quality Gate
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Quality Gate Status Notice
        if: env.SONAR_TOKEN == ''
        run: |
          echo "ℹ️ SonarQube scanning skipped: SONAR_TOKEN secret not yet configured in GitHub repository."
