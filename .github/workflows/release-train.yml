name: Scheduled Release Train (develop -> main)

on:
  schedule:
    # Triggers every Monday and Wednesday at 09:00 UTC (14:30 IST)
    - cron: '0 9 * * 1,3'
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Automatically merge develop into main if CI passes (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-train:
    name: Prepare Bi-Weekly Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Changes Between develop and main
        id: check_diff
        run: |
          git fetch origin main develop
          DIFF_COUNT=$(git rev-list --count origin/main..origin/develop || echo 0)
          echo "diff_count=$DIFF_COUNT" >> $GITHUB_OUTPUT
          echo "Commits in develop ahead of main: $DIFF_COUNT"

      - name: Create or Update Release Pull Request
        if: steps.check_diff.outputs.diff_count > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: develop
          title: "🚀 Bi-Weekly Release Train: Merge `develop` into `main` (${{ steps.check_diff.outputs.diff_count }} commits)"
          body: |
            ## 🚆 Bi-Weekly Release Train Sync

            This automated pull request synchronizes tested features from `develop` into `main` for release.

            ### Quality Gates Enforced:
            - [x] PyRuff linter and formatting passed
            - [x] PyLint error checks passed
            - [x] SonarQube quality gate and security audits
            - [x] CodeRabbit AI PR review for vulnerabilities and bug regression
            - [x] Automated test suite & coverage checks

            *Scheduled run: Monday & Wednesday release cadence.*
          labels: |
            release-train
            automated-sync
